services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      # Docker Compose tự đọc file .env cùng thư mục để thay các biến ${...} dưới đây.
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00 # lưu thời gian theo UTC
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306" # chỉ mở cho máy local, không lộ ra mạng
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data: